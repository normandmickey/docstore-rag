<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Docstore RAG</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #eef2ff; margin: 0; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 64px 24px; }
    .card { background: #121a33; border: 1px solid #243055; border-radius: 16px; padding: 28px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0 16px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { padding: 12px 16px; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Create account</h1>
      {% if invite %}
        <p>You're joining{% if invite.tenant %} <strong>{{ invite.tenant.name }}</strong>{% else %} Docstore{% endif %} with an invite.</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        {% if invite_token %}
          <input type="hidden" name="invite" value="{{ invite_token }}">
        {% endif %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
      </form>
      <p><a href="/login/">Already have an account?</a></p>
    </div>
  </div>
</body>
</html>
