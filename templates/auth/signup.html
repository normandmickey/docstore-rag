<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Ragbee</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #eef2ff; margin: 0; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 64px 24px; }
    .card { background: #121a33; border: 1px solid #243055; border-radius: 16px; padding: 28px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0 16px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { padding: 12px 16px; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; width: 100%; }
    a { color: #93c5fd; }
    .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #64748b; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #243055; }
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; color: #eef2ff; cursor: pointer; width: 100%; text-decoration: none; font-size: 0.95rem; font-family: inherit; transition: background 0.15s; }
    .google-btn:hover { background: #162032; }
    .google-btn img { width: 20px; height: 20px; }
    .links { margin-top: 16px; }
    .links p { margin: 8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Create account · <span style="font-size:0.85em">🐝 Ragbee</span></h1>
      {% if invite %}
        <p>You're joining{% if invite.tenant %} <strong>{{ invite.tenant.name }}</strong>{% else %} Ragbee{% endif %} with an invite.</p>
      {% endif %}

      <a class="google-btn" href="/accounts/google/login/?process=signup">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285F4' d='M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z'/%3E%3Cpath fill='%2334A853' d='M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z'/%3E%3Cpath fill='%23FBBC05' d='M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z'/%3E%3Cpath fill='%23EA4335' d='M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z'/%3E%3C/svg%3E" alt="Google">
        Sign up with Google
      </a>

      <div class="divider">or</div>

      <form method="post">
        {% csrf_token %}
        {% if invite_token %}
          <input type="hidden" name="invite" value="{{ invite_token }}">
        {% endif %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
      </form>

      <div class="links">
        <p><a href="/login/">Already have an account?</a> · <a href="/billing/pricing/">View plans</a></p>
      </div>
    </div>
  </div>
</body>
</html>
