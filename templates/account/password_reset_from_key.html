<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password · Docstore</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #eef2ff; margin: 0; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 64px 24px; }
    .card { background: #121a33; border: 1px solid #243055; border-radius: 16px; padding: 28px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0 16px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { padding: 12px 16px; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; }
    a { color: #93c5fd; }
    p { color: #cbd5e1; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Set a new password</h1>
      {% if token_fail %}
        <p>This password reset link is invalid or has already been used.</p>
        <p><a href="{% url 'account_reset_password' %}">Request a new reset link</a></p>
      {% else %}
        <p>Choose a new password for your account.</p>
        <form method="post" action="{{ action_url }}">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Save new password</button>
        </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
